  <noscript><p class="no-script">Enable JavaScript to tune the radio and read the dedications.</p></noscript>

  <script>
/* The personal copy and optional media links are in RADIO_CONFIG at the top. */
(() => {
  "use strict";
  const config = RADIO_CONFIG;
  const byId = (id) => document.getElementById(id);
  const ui = Object.fromEntries([
    "stationList", "listen", "sleeve", "customCover", "tuned", "trackTitle", "artist",
    "dedication", "noteText", "noteHeading", "songActions", "notice", "receiverStatus",
    "songLink", "songLabel", "songGlyph", "songPanel", "embedSlot", "externalSong",
    "closeSong", "radioNeedle", "radioKnob", "svgFrequency", "announcement"
  ].map((id) => [id, byId(id)]));
  const stations = config.stations;
  let current = -1;
  let embedId = "";
  let streamURL = "";
  let songAudioURL = "";
  let songAudio = null;
  let pendingCover = null;
  const discovered = new Set();

  function fill(value) {
    return String(value == null ? "" : value).replace(/\{(recipient|sender)\}/g, (_, key) => String(config[key] || ""));
  }
  function frequency(station) { return Number(station.frequency).toFixed(1); }
  function safeURL(raw, mediaType) {
    const value = String(raw || "").trim();
    if (!value) return "";
    if (mediaType && value.toLowerCase().startsWith("data:" + mediaType + "/")) return value;
    try {
      const url = new URL(value, document.baseURI);
      if (url.protocol === "https:" || url.protocol === "http:") return url.href;
      if (mediaType && url.protocol === "file:" && location.protocol === "file:") return url.href;
    } catch (_) { /* A missing optional asset leaves its built-in alternative. */ }
    return "";
  }
  function youtubeId(url) {
    if (!url) return "";
    const parsed = new URL(url);
    const host = parsed.hostname.toLowerCase().replace(/^(www\.|m\.|music\.)/, "");
    let id = "";
    if (host === "youtu.be") id = parsed.pathname.slice(1);
    if (host === "youtube.com" || host === "youtube-nocookie.com") {
      id = parsed.searchParams.get("v") || parsed.pathname.match(/^\/(?:embed|shorts)\/([^/]+)/)?.[1] || "";
    }
    return /^[\w-]{11}$/.test(id) ? id : "";
  }
  function showNotice(message = "") {
    ui.notice.textContent = message;
    ui.notice.hidden = !message;
  }
  function showSongPanel(open) {
    ui.songPanel.hidden = !open;
    if (embedId || songAudioURL) ui.songLink.setAttribute("aria-expanded", String(open));
    document.body.classList.toggle("song-channel", open);
    ui.receiverStatus.textContent = open ? "Song channel" : "Receiver ready";
  }
  function closeStream() {
    if (songAudio) {
      songAudio.onerror = null;
      songAudio.pause();
      songAudio.removeAttribute("src");
      songAudio.load();
      songAudio = null;
    }
    ui.embedSlot.classList.remove("audio-slot");
    ui.embedSlot.replaceChildren();
    showSongPanel(false);
  }
  function openSong(event) {
    if (!streamURL && !songAudioURL) { event.preventDefault(); return; }
    if (!ui.songPanel.hidden && !event.ctrlKey && !event.metaKey && !event.shiftKey && !event.altKey) {
      event.preventDefault(); closeStream(); return;
    }
    if (navigator.onLine === false && !/^(?:data:|file:)/i.test(songAudioURL)) {
      event.preventDefault(); showNotice("Connect to the internet to stream this song."); return;
    }
    showNotice();
    // Local files have no web referrer. Use the official watch link directly.
    if ((!embedId && !songAudioURL) || event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;
    event.preventDefault();
    showSongPanel(true);
    if (songAudioURL) {
      const player = document.createElement("audio");
      songAudio = player;
      player.controls = true;
      player.setAttribute("aria-label", fill(stations[current].songTitle));
      player.onerror = () => {
        if (songAudio === player) showNotice(streamURL ? "The song file couldn’t load. Use the song link in the player below." : "The song file couldn’t load. The dedication is still available.");
      };
      ui.embedSlot.classList.add("audio-slot");
      ui.embedSlot.replaceChildren(player);
      player.src = songAudioURL;
      player.play().catch(() => { /* Native controls remain available for manual playback. */ });
      return;
    }
    const frame = document.createElement("iframe");
    frame.title = fill(stations[current].songTitle) + " — official YouTube player";
    frame.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen";
    frame.allowFullscreen = true;
    frame.referrerPolicy = "strict-origin-when-cross-origin";
    frame.src = "https://www.youtube-nocookie.com/embed/" + embedId + "?autoplay=1&playsinline=1";
    ui.embedSlot.replaceChildren(frame);
  }
  function updateCover(station) {
    const types = {moon:"coverMoon", highway:"coverHighway", tape:"coverTape"};
    const selected = types[station.sleeve] || types.moon;
    for (const name of Object.values(types)) byId(name).style.display = name === selected ? "" : "none";
    ui.customCover.hidden = true; ui.customCover.removeAttribute("src");
    if (pendingCover) { pendingCover.onload = pendingCover.onerror = null; pendingCover = null; }
    const src = safeURL(station.coverURL, "image");
    if (!src) return;
    const candidate = new Image(); pendingCover = candidate;
    candidate.onload = () => {
      if (pendingCover !== candidate) return;
      ui.customCover.src = candidate.src; ui.customCover.hidden = false;
      pendingCover = null;
    };
    candidate.onerror = () => { if (pendingCover === candidate) pendingCover = null; };
    candidate.src = src;
  }
  function guideName(station, index) {
    return fill(station.secret && discovered.has(index) ? station.revealedName || station.name : station.name);
  }
  function addPresets() {
    stations.forEach((station, index) => {
      const button = document.createElement("button");
      button.type = "button"; button.className = "station"; button.setAttribute("aria-controls", "listen");
      const freq = document.createElement("span"); freq.className = "station-freq"; freq.append(frequency(station));
      const fm = document.createElement("small"); fm.textContent = "FM"; freq.append(fm);
      const titles = document.createElement("span");
      const title = document.createElement("span"); title.className = "station-name";
      const sub = document.createElement("span"); sub.className = "station-description"; sub.textContent = fill(station.guideLine);
      titles.append(title, sub);
      const indicator = document.createElement("span"); indicator.className = "indicator"; indicator.setAttribute("aria-hidden", "true");
      button.append(freq, titles, indicator);
      button.addEventListener("click", () => tune(index));
      ui.stationList.append(button);
    });
  }
  function tune(index) {
    if (index === current) return;
    const first = current < 0;
    const station = stations[index];
    closeStream();
    current = index;
    if (station.secret) discovered.add(index);
    Array.from(ui.stationList.children).forEach((button, i) => {
      button.setAttribute("aria-pressed", String(i === index));
      button.querySelector(".station-name").textContent = guideName(stations[i], i);
    });
    const freq = frequency(station);
    ui.tuned.textContent = freq + " FM" + (station.secret ? " · Off the record" : " · Tuned in");
    ui.svgFrequency.textContent = freq;
    const ratio = Math.max(0, Math.min(1, (Number(station.frequency) - 88) / 20));
    ui.radioNeedle.style.transform = "translateX(" + (201 + 175 * ratio) + "px)";
    ui.radioKnob.style.transform = "rotate(" + (-80 + ratio * 160) + "deg)";
    ui.trackTitle.textContent = fill(station.secret ? station.outtakeTitle : station.songTitle);
    ui.artist.textContent = fill(station.secret ? station.outtakeCredit : station.artist);
    ui.noteHeading.textContent = station.secret ? "Off-script note" : "Dedication";
    ui.noteText.textContent = fill(station.transcript);
    ui.dedication.hidden = !ui.noteText.textContent.trim();
    showNotice();
    updateCover(station);
    streamURL = station.secret ? "" : safeURL(station.songURL);
    songAudioURL = station.secret ? "" : safeURL(station.songAudioURL, "audio");
    embedId = /^https?:$/.test(location.protocol) && location.origin !== "null" ? youtubeId(streamURL) : "";
    ui.songActions.hidden = !streamURL && !songAudioURL;
    ui.externalSong.hidden = !streamURL;
    if (streamURL) {
      ui.externalSong.href = streamURL;
      ui.externalSong.firstChild.textContent = youtubeId(streamURL) ? "Open on YouTube " : "Open song link ";
    } else ui.externalSong.removeAttribute("href");
    if (streamURL || songAudioURL) {
      ui.songLink.href = streamURL || songAudioURL;
      ui.songLabel.textContent = embedId || songAudioURL ? "Listen to song" : youtubeId(streamURL) ? "Listen on YouTube" : "Open song";
      ui.songGlyph.setAttribute("href", embedId || songAudioURL ? "#i-down" : "#i-up");
    } else ui.songLink.removeAttribute("href");
    if (embedId || songAudioURL) {
      ui.songLink.setAttribute("aria-controls", "songPanel");
      ui.songLink.setAttribute("aria-expanded", "false");
    } else { ui.songLink.removeAttribute("aria-controls"); ui.songLink.removeAttribute("aria-expanded"); }
    if (!first) {
      ui.announcement.textContent = "Tuned to " + freq + " FM, " + guideName(station, index) + ". " + ui.trackTitle.textContent;
      ui.listen.classList.remove("retune"); void ui.listen.offsetWidth; ui.listen.classList.add("retune");
    }
  }
  byId("brandName").textContent = fill(config.brand);
  byId("titleFirst").textContent = fill(config.titleFirstLine);
  byId("titleSecond").textContent = fill(config.titleSecondLine);
  byId("introduction").textContent = fill(config.introduction);
  byId("airDate").textContent = fill(config.airDate);
  byId("signOff").textContent = fill(config.signOff);
  document.title = [fill(config.titleFirstLine), fill(config.titleSecondLine)].join(" ") + " · " + fill(config.brand);
  ui.songLink.addEventListener("click", openSong);
  ui.closeSong.addEventListener("click", () => { closeStream(); ui.songLink.focus(); });
  window.addEventListener("pagehide", closeStream);
  addPresets();
  if (stations.length) tune(0);
})();
